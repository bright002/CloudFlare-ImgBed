<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫画无缝阅读器</title>
    <style>
        /* 全局重置与沉浸式背景 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        /* 顶部菜单栏：支持滚动平滑隐藏 */
        #menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
            transition: transform 0.3s ease-in-out;
        }
        #menu.hidden {
            transform: translateY(-100%);
        }

        .menu-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select, button {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        select option {
            background: #222;
            color: #fff;
        }
        button:hover, select:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 漫画无缝条漫容器 */
        #reader-container {
            max-width: 900px;
            margin: 70px auto 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #000;
            min-height: 100vh;
        }

        /* 漫画图片基础样式 */
        .manga-page {
            width: 100%;
            display: block;
            height: auto;
            margin: 0;
            padding: 0;
            border: none;
            outline: none;
            background-color: #1a1a1a; 
        }

        /* 适配模式样式 */
        #reader-container.fit-width .manga-page {
            width: 100% !important;
            max-width: 100%;
        }
        #reader-container.fit-original .manga-page {
            width: auto !important;
            max-width: none;
        }

        /* 加载提示文字 */
        #loading-tip {
            padding: 40px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 顶部控制菜单栏 -->
    <div id="menu">
        <div class="menu-group">
            <select id="folder-select" onchange="changeFolder()">
                <option value="">请选择卷册 / 目录</option>
            </select>
        </div>
        <div class="menu-group">
            <button id="mode-btn" onclick="toggleMode()">切换：满宽</button>
        </div>
    </div>

    <!-- 无缝条漫图片展示区 -->
    <div id="reader-container" class="fit-width">
        <div id="loading-tip">正在加载目录与图片...</div>
    </div>

    <script>
        const API_LIST_URL = '/api/manage/list'; 
        let currentMode = 'fit-width';
        let allFilesCache = []; // 缓存文件列表，避免重复请求

        window.addEventListener('DOMContentLoaded', () => {
            fetchFolderList();
            initScrollHideMenu();
        });

        // 1. 手机端滚动自动隐藏/显示 Menu 栏逻辑
        function initScrollHideMenu() {
            let lastScrollTop = 0;
            const menu = document.getElementById('menu');

            window.addEventListener('scroll', function() {
                let currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                if (currentScroll > 50) {
                    if (currentScroll > lastScrollTop) {
                        menu.classList.add('hidden');
                    } else {
                        menu.classList.remove('hidden');
                    }
                } else {
                    menu.classList.remove('hidden');
                }
                lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
            }, false);
        }

        // 2. 获取图床目录列表
        async function fetchFolderList() {
            try {
                const response = await fetch(API_LIST_URL);
                const data = await response.json();
                
                // 完美兼容各种返回格式 (数组、{data: [...]}, {files: [...]})
                allFilesCache = Array.isArray(data) ? data : (data.data || data.files || data.list || []);
                
                console.log("获取到的图床原始文件数:", allFilesCache.length);
                processFolders(allFilesCache);
            } catch (error) {
                console.error('获取目录失败:', error);
                document.getElementById('loading-tip').innerText = '加载目录失败，请检查 API 接口。';
            }
        }

        // 3. 提取文件夹并按自然升序排序
        function processFolders(files) {
            const folderSet = new Set();

            files.forEach(file => {
                // 兼容所有可能的路径字段
                const filePath = file.path || file.name || file.filename || file.key || '';
                const lastSlashIndex = filePath.lastIndexOf('/');
                
                if (lastSlashIndex !== -1) {
                    const folderPath = filePath.substring(0, lastSlashIndex);
                    folderSet.add(folderPath);
                }
            });

            const folders = Array.from(folderSet);
            folders.sort((a, b) => compareNatural(a, b));

            const select = document.getElementById('folder-select');
            select.innerHTML = '<option value="">请选择卷册 / 目录</option>';

            folders.forEach(folder => {
                const option = document.createElement('option');
                option.value = folder;
                option.textContent = folder;
                select.appendChild(option);
            });

            if (folders.length > 0) {
                select.value = folders[0];
                changeFolder();
            } else {
                document.getElementById('loading-tip').innerText = '未检测到任何云端虚拟文件夹，请检查图片是否带目录路径。';
            }
        }

        // 4. 切换卷册时加载对应目录下的所有图片
        async function changeFolder() {
            const selectedFolder = document.getElementById('folder-select').value;
            if (!selectedFolder) return;

            const container = document.getElementById('reader-container');
            container.innerHTML = '<div id="loading-tip">正在加载漫画图片...</div>';

            // 直接从缓存中筛选，提升响应速度
            const folderImages = allFilesCache.filter(file => {
                const filePath = file.path || file.name || file.filename || file.key || '';
                return filePath.startsWith(selectedFolder + '/') && isImageFile(filePath);
            });

            // 图片自然升序排序
            folderImages.sort((a, b) => {
                const pathA = a.path || a.name || a.filename || a.key || '';
                const pathB = b.path || b.name || b.filename || b.key || '';
                return compareNatural(pathA.split('/').pop(), pathB.split('/').pop());
            });

            renderImages(folderImages);
        }

        // 5. 渲染无缝条漫图片列表
        function renderImages(images) {
            const container = document.getElementById('reader-container');
            container.innerHTML = '';

            if (images.length === 0) {
                container.innerHTML = '<div id="loading-tip">此目录下没有找到图片。</div>';
                return;
            }

            images.forEach(img => {
                const imgElement = document.createElement('img');
                imgElement.src = img.url || img.src || img.link || ('/' + (img.path || img.name || img.filename || img.key));
                imgElement.className = 'manga-page';
                imgElement.loading = 'lazy';
                
                imgElement.onerror = function() {
                    this.alt = '图片加载失败: ' + imgElement.src;
                };

                container.appendChild(imgElement);
            });
        }

        // 6. 切换阅读模式
        function toggleMode() {
            const container = document.getElementById('reader-container');
            const btn = document.getElementById('mode-btn');

            if (currentMode === 'fit-width') {
                currentMode = 'fit-original';
                container.classList.remove('fit-width');
                container.classList.add('fit-original');
                btn.textContent = '切换：原图';
            } else {
                currentMode = 'fit-width';
                container.classList.remove('fit-original');
                container.classList.add('fit-width');
                btn.textContent = '切换：满宽';
            }
        }

        // 7. 高精度自然升序排序算法
        function compareNatural(a, b) {
            const ax = [], bx = [];
            a.replace(/(\d+)|(\D+)/g, (_, $1, $2) => { ax.push([$1 || Infinity, $2 || '']); });
            b.replace(/(\d+)|(\D+)/g, (_, $1, $2) => { bx.push([$1 || Infinity, $2 || '']); });
            
            while (ax.length && bx.length) {
                const an = ax.shift();
                const bn = bx.shift();
                const nn = (an[0] - bn[0]) || an[1].localeCompare(bn[1]);
                if (nn) return nn;
            }
            return ax.length - bx.length;
        }

        // 8. 判断是否为图片后缀
        function isImageFile(filename) {
            return /\.(jpg|jpeg|png|webp|avif|gif)$/i.test(filename);
        }
    </script>
</body>
</html>
