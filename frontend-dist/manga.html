<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私人云端漫画浏览器</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #121212; color: #e0e0e0; font-family: system-ui, -apple-system, sans-serif; }
    
    .toolbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px);
      padding: 12px 20px; border-bottom: 1px solid #333;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: transform 0.3s ease-in-out;
    }
    .toolbar.hidden {
      transform: translateY(-100%);
    }

    input, button {
      background: #262626; color: #fff; border: 1px solid #444;
      padding: 8px 12px; border-radius: 6px; font-size: 14px;
    }
    button { background: #2563eb; border: none; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    .mode-btn { background: #374151; }
    .mode-btn.active { background: #10b981; }

    .folder-bar {
      padding: 12px 20px; background: #181818; border-bottom: 1px solid #222;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 48px;
    }
    .folder-tag {
      padding: 6px 12px; background: #2d3748; border-radius: 6px;
      cursor: pointer; font-size: 13px; user-select: none; transition: background 0.2s;
    }
    .folder-tag:hover { background: #4a5568; }

    /* 布局模式 */
    .gallery.waterfall { padding: 16px; column-count: 4; column-gap: 14px; }
    @media (max-width: 1400px) { .gallery.waterfall { column-count: 3; } }
    @media (max-width: 900px)  { .gallery.waterfall { column-count: 2; } }
    @media (max-width: 500px)  { .gallery.waterfall { column-count: 1; } }
    .gallery.waterfall .card { break-inside: avoid; margin-bottom: 14px; border-radius: 8px; overflow: hidden; background: #1e1e1e; position: relative; min-height: 200px; text-align: center; }

    .gallery.webtoon { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; background: #000; }
    .gallery.webtoon .card { width: 100%; margin: 0; position: relative; min-height: 300px; border-bottom: 1px solid #111; text-align: center; }

    /* 宽度控制 */
    .gallery.fit-width .card img {
      width: 100% !important; max-width: 100% !important; height: auto; display: block; margin: 0 auto; cursor: zoom-in;
    }
    .gallery.orig-size .card img {
      width: auto !important; max-width: 100%; height: auto; display: inline-block; cursor: zoom-in;
    }

    .page-badge {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.7); color: #ccc; font-size: 11px;
      padding: 3px 7px; border-radius: 4px; pointer-events: none;
    }

    .msg-box {
      padding: 40px 20px; text-align: center; font-size: 15px; line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="toolbar" id="toolbar">
    <input type="text" id="dir" value="" placeholder="输入漫画文件夹 (例如 狱学/vol01，留空查看根目录)" style="flex:1; min-width:240px;">
    <input type="password" id="token" placeholder="后台密码 (可留空/支持admin:密码)" style="width:180px;">
    <button onclick="loadManga()">📂 加载漫画</button>
    
    <div style="margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;">
      <button id="btnSize" class="mode-btn active" onclick="toggleSize()">📏 自适应满宽</button>
      <button id="btnWf" class="mode-btn" onclick="setMode('waterfall')">🌊 瀑布流</button>
      <button id="btnWt" class="mode-btn active" onclick="setMode('webtoon')">📜 无缝条漫</button>
    </div>
  </div>

  <div class="folder-bar" id="folders"></div>
  <div id="gallery" class="gallery webtoon fit-width">
    <div class="msg-box" style="color:#888;">
      💡 请在上方输入漫画文件夹路径（例如：<code>狱学/vol01</code>），或直接点击「加载漫画」浏览目录。
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
  <script>
    Fancybox.bind("[data-fancybox='manga-browser']", { Hash: false });
    document.getElementById('token').value = localStorage.getItem('imgbed_auth') || '';

    let isFitWidth = true;

    // 监听页面滚动自动隐藏/显示顶部工具栏
    (function() {
      let lastScrollY = window.scrollY;
      const toolbar = document.getElementById('toolbar');
      window.addEventListener('scroll', () => {
        const currentScrollY = window.scrollY;
        if (currentScrollY > 80) {
          if (currentScrollY > lastScrollY + 5) {
            toolbar.classList.add('hidden');
          } else if (currentScrollY < lastScrollY - 10) {
            toolbar.classList.remove('hidden');
          }
        } else {
          toolbar.classList.remove('hidden');
        }
        lastScrollY = currentScrollY <= 0 ? 0 : currentScrollY;
      }, { passive: true });
    })();

    function setMode(mode) {
      const gallery = document.getElementById('gallery');
      const sizeClass = isFitWidth ? 'fit-width' : 'orig-size';
      gallery.className = 'gallery ' + mode + ' ' + sizeClass;
      
      document.getElementById('btnWf').classList.toggle('active', mode === 'waterfall');
      document.getElementById('btnWt').classList.toggle('active', mode === 'webtoon');
    }

    function toggleSize() {
      isFitWidth = !isFitWidth;
      const gallery = document.getElementById('gallery');
      const btn = document.getElementById('btnSize');
      
      if (isFitWidth) {
        gallery.classList.replace('orig-size', 'fit-width');
        btn.textContent = '📏 自适应满宽';
        btn.classList.add('active');
      } else {
        gallery.classList.replace('fit-width', 'orig-size');
        btn.textContent = '🔍 原始尺寸';
        btn.classList.remove('active');
      }
    }

    async function fetchWithRetry(url, options, retries = 1) {
      const res = await fetch(url, options);
      // 遇到 503 且允许重试时，自动等待 1.5 秒重试一次，平滑避开 D1 锁表
      if (res.status === 503 && retries > 0) {
        await new Promise(r => setTimeout(r, 1500));
        return fetchWithRetry(url, options, retries - 1);
      }
      return res;
    }

    async function loadManga() {
      const domain = window.location.origin;
      const dir = document.getElementById('dir').value.trim();
      const auth = document.getElementById('token').value.trim();
      localStorage.setItem('imgbed_auth', auth);

      const gallery = document.getElementById('gallery');
      const folderBar = document.getElementById('folders');
      gallery.innerHTML = '<div class="msg-box" style="color:#aaa;">⏳ 正在读取目录与图片，请稍候...</div>';
      folderBar.innerHTML = '';

      const headers = {};
      if (auth) {
        headers['Authorization'] = auth.includes(':') ? 'Basic ' + btoa(auth) : 'Bearer ' + auth;
      }

      // 关键防崩策略：若未指定具体文件夹，单次请求量降为 50（防 1 万条全表扫描 503）；若指定了卷目录，单次拉取 200 张
      const requestCount = dir ? 200 : 50;
      const apiUrl = `${domain}/api/manage/list?dir=${encodeURIComponent(dir)}&start=0&count=${requestCount}`;

      try {
        const res = await fetchWithRetry(apiUrl, { headers, credentials: 'include' });

        if (res.status === 401 || res.status === 403) {
          throw new Error('认证失败 (401/403)：请检查后台密码是否正确，或先在当前浏览器登录一次 /dashboard。');
        }
        if (res.status === 503) {
          throw new Error('D1 数据库繁忙或操作超时 (503)：通常是由于近期执行过全量索引。请稍等 3~5 秒后重新点击“加载漫画”。');
        }
        if (!res.ok) {
          throw new Error(`服务器响应异常 (HTTP ${res.status})`);
        }

        const data = await res.json();

        // 渲染文件夹导航栏
        let folderHtml = '';
        if (dir) {
          const parentDir = dir.includes('/') ? dir.substring(0, dir.lastIndexOf('/')) : '';
          folderHtml += `<span class="folder-tag" onclick="enterDir('${parentDir}')">⬅ 返回上一级</span>`;
        }
        if (data.directories && data.directories.length > 0) {
          const sortedDirs = [...data.directories].sort((a, b) => 
            String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' })
          );
          folderHtml += sortedDirs.map(d => 
            `<span class="folder-tag" onclick="enterDir('${d}')">📁 ${d}</span>`
          ).join('');
        }
        folderBar.innerHTML = folderHtml || '<span style="color:#666; font-size:13px;">当前目录下无子文件夹</span>';

        // 过滤图片格式
        let files = (data.files || data || []).filter(f => {
          const name = typeof f === 'string' ? f : (f.name || f.src || '');
          return /\.(jpe?g|png|webp|gif|avif)$/i.test(name);
        });

        if (files.length === 0) {
          if (data.directories && data.directories.length > 0) {
            gallery.innerHTML = '<div class="msg-box" style="color:#9ca3af;">📁 请点击上方的子文件夹进入具体的漫画卷册。</div>';
          } else {
            gallery.innerHTML = '<div class="msg-box" style="color:#888;">该目录下未检索到图片，请确认文件夹名称是否正确。</div>';
          }
          return;
        }

        // 自然数字排序 (第1页、第2页、第10页)
        files.sort((a, b) => {
          const rawA = typeof a === 'string' ? a : (a.name || a.src || '');
          const rawB = typeof b === 'string' ? b : (b.name || b.src || '');
          const cleanA = rawA.split('/').pop().replace(/^\d{10,}_/, '');
          const cleanB = rawB.split('/').pop().replace(/^\d{10,}_/, '');
          
          const regex = /(\d+)|(\D+)/g;
          const chunksA = cleanA.match(regex) || [];
          const chunksB = cleanB.match(regex) || [];
          
          for (let i = 0; i < Math.max(chunksA.length, chunksB.length); i++) {
            if (!chunksA[i]) return -1;
            if (!chunksB[i]) return 1;
            const chunkA = chunksA[i];
            const chunkB = chunksB[i];
            const isNumA = /^\d+$/.test(chunkA);
            const isNumB = /^\d+$/.test(chunkB);
            
            if (isNumA && isNumB) {
              const diff = parseInt(chunkA, 10) - parseInt(chunkB, 10);
              if (diff !== 0) return diff;
            } else {
              const comp = chunkA.localeCompare(chunkB);
              if (comp !== 0) return comp;
            }
          }
          return 0;
        });

        const currentMode = document.getElementById('btnWf').classList.contains('active') ? 'waterfall' : 'webtoon';
        const sizeClass = isFitWidth ? 'fit-width' : 'orig-size';
        gallery.className = 'gallery ' + currentMode + ' ' + sizeClass;
        gallery.innerHTML = '';

        // 渲染图片卡片
        files.forEach((item, idx) => {
          const rawName = typeof item === 'string' ? item : (item.name || item.src);
          const imgUrl = rawName.startsWith('http') ? rawName : `${domain}/file/${rawName.replace(/^\/?file\//, '')}`;
          const cleanName = rawName.split('/').pop().replace(/^\d{10,}_/, '');

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <a href="${imgUrl}" data-fancybox="manga-browser" data-caption="第 ${idx + 1} 页 - ${cleanName}">
              <img data-src="${imgUrl}" alt="Page ${idx + 1}" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 400'%3E%3C/svg%3E">
            </a>
            <span class="page-badge">${idx + 1} / ${files.length}</span>
          `;
          gallery.appendChild(card);
        });

        // 图片懒加载
        const observer = new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const img = entry.target;
              img.src = img.dataset.src;
              obs.unobserve(img);
            }
          });
        }, { rootMargin: '1000px 0px' });

        document.querySelectorAll('img[data-src]').forEach(img => observer.observe(img));

      } catch (e) {
        gallery.innerHTML = `
          <div class="msg-box" style="color:#f87171;">
            <p style="font-weight:bold; font-size:16px;">⚠️ 加载出现问题</p>
            <p style="margin-top:8px; color:#e5e7eb;">${e.message}</p>
          </div>
        `;
      }
    }

    function enterDir(targetPath) {
      document.getElementById('dir').value = targetPath;
      loadManga();
    }
  </script>
</body>
</html>
