<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私人云端漫画浏览器</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #121212; color: #e0e0e0; font-family: system-ui, sans-serif; }
    
    .toolbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px);
      padding: 12px 20px; border-bottom: 1px solid #333;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    input, button {
      background: #262626; color: #fff; border: 1px solid #444;
      padding: 8px 12px; border-radius: 6px; font-size: 14px;
    }
    button { background: #2563eb; border: none; cursor: pointer; font-weight: 600; }
    button:hover { background: #1d4ed8; }
    .mode-btn { background: #374151; }
    .mode-btn.active { background: #10b981; }

    .folder-bar {
      padding: 12px 20px; background: #181818; border-bottom: 1px solid #222;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .folder-tag {
      padding: 6px 12px; background: #2d3748; border-radius: 6px;
      cursor: pointer; font-size: 13px; user-select: none;
    }
    .folder-tag:hover { background: #4a5568; }

    /* 布局模式 */
    .gallery.waterfall { padding: 16px; column-count: 4; column-gap: 14px; }
    @media (max-width: 1400px) { .gallery.waterfall { column-count: 3; } }
    @media (max-width: 900px)  { .gallery.waterfall { column-count: 2; } }
    @media (max-width: 500px)  { .gallery.waterfall { column-count: 1; } }
    .gallery.waterfall .card { break-inside: avoid; margin-bottom: 14px; border-radius: 8px; overflow: hidden; background: #1e1e1e; position: relative; min-height: 200px; text-align: center; }

    .gallery.webtoon { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; background: #000; }
    .gallery.webtoon .card { width: 100%; margin: 0; position: relative; min-height: 400px; border-bottom: 1px solid #111; text-align: center; }

    /* 宽度控制：自适应满宽 vs 原始尺寸 */
    .gallery.fit-width .card img {
      width: 100% !important;
      max-width: 100% !important;
      height: auto;
      display: block;
      margin: 0 auto;
      cursor: zoom-in;
    }
    .gallery.orig-size .card img {
      width: auto !important;
      max-width: 100%;
      height: auto;
      display: inline-block;
      cursor: zoom-in;
    }

    .page-badge {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.7); color: #ccc; font-size: 11px;
      padding: 3px 7px; border-radius: 4px; pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <input type="text" id="dir" value="" placeholder="输入漫画文件夹 (例如 狱学/vol01)" style="flex:1; min-width:280px;">
    <input type="password" id="token" placeholder="后台密码 (Basic 认证，如 admin:密码)" style="width:200px;">
    <button onclick="loadManga()">📂 加载漫画</button>
    
    <div style="margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;">
      <button id="btnSize" class="mode-btn active" onclick="toggleSize()">📏 自适应满宽</button>
      <button id="btnWf" class="mode-btn active" onclick="setMode('waterfall')">🌊 瀑布流</button>
      <button id="btnWt" class="mode-btn" onclick="setMode('webtoon')">📜 无缝条漫</button>
    </div>
  </div>

  <div class="folder-bar" id="folders"></div>
  <div id="gallery" class="gallery waterfall fit-width"></div>

  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
  <script>
    Fancybox.bind("[data-fancybox='manga-browser']", { Hash: false });
    document.getElementById('token').value = localStorage.getItem('imgbed_auth') || '';

    let isFitWidth = true;

    function setMode(mode) {
      const gallery = document.getElementById('gallery');
      const sizeClass = isFitWidth ? 'fit-width' : 'orig-size';
      gallery.className = 'gallery ' + mode + ' ' + sizeClass;
      
      document.getElementById('btnWf').classList.toggle('active', mode === 'waterfall');
      document.getElementById('btnWt').classList.toggle('active', mode === 'webtoon');
    }

    function toggleSize() {
      isFitWidth = !isFitWidth;
      const gallery = document.getElementById('gallery');
      const btn = document.getElementById('btnSize');
      
      if (isFitWidth) {
        gallery.classList.replace('orig-size', 'fit-width');
        btn.textContent = '📏 自适应满宽';
        btn.classList.add('active');
      } else {
        gallery.classList.replace('fit-width', 'orig-size');
        btn.textContent = '🔍 原始尺寸';
        btn.classList.remove('active');
      }
    }

    async function loadManga() {
      const domain = window.location.origin;
      const dir = document.getElementById('dir').value.trim();
      const auth = document.getElementById('token').value.trim();
      localStorage.setItem('imgbed_auth', auth);

      const gallery = document.getElementById('gallery');
      const folderBar = document.getElementById('folders');
      gallery.innerHTML = '<p style="padding:40px; text-align:center; color:#888;">正在连接图床加载目录...</p>';
      folderBar.innerHTML = '';

      const headers = {};
      if (auth) {
        headers['Authorization'] = auth.includes(':') ? 'Basic ' + btoa(auth) : 'Bearer ' + auth;
      }

      const apiUrl = `${domain}/api/manage/list?dir=${encodeURIComponent(dir)}&start=0&count=400`;
      try {
        const res = await fetch(apiUrl, { headers, credentials: 'include' });
        if (!res.ok) throw new Error('API 请求失败，请检查密码或登录状态');
        const data = await res.json();

        let folderHtml = '';
        if (dir) {
          const parentDir = dir.includes('/') ? dir.substring(0, dir.lastIndexOf('/')) : '';
          folderHtml += `<span class="folder-tag" onclick="enterDir('${parentDir}')">⬅ 返回上一级</span>`;
        }
        if (data.directories && data.directories.length > 0) {
          folderHtml += data.directories.map(d => 
            `<span class="folder-tag" onclick="enterDir('${d}')">📁 ${d}</span>`
          ).join('');
        }
        folderBar.innerHTML = folderHtml || '<span style="color:#666; font-size:13px;">当前目录下无子文件夹</span>';

        // 1. 过滤图片文件
        let files = (data.files || data || []).filter(f => {
          const name = typeof f === 'string' ? f : (f.name || f.src || '');
          return /\.(jpe?g|png|webp|gif|avif)$/i.test(name);
        });

        // 2. 高精度自然排序算法（确保 000.jpg 稳居第一，10.jpg 在 2.jpg 后面）
        files.sort((a, b) => {
          const nA = typeof a === 'string' ? a : (a.name || a.src || '');
          const nB = typeof b === 'string' ? b : (b.name || b.src || '');
          
          const regex = /(\d+)|(\D+)/g;
          const chunksA = nA.match(regex) || [];
          const chunksB = nB.match(regex) || [];
          
          for (let i = 0; i < Math.max(chunksA.length, chunksB.length); i++) {
            if (!chunksA[i]) return -1;
            if (!chunksB[i]) return 1;
            
            const chunkA = chunksA[i];
            const chunkB = chunksB[i];
            
            const isNumA = /^\d+$/.test(chunkA);
            const isNumB = /^\d+$/.test(chunkB);
            
            if (isNumA && isNumB) {
              const diff = parseInt(chunkA, 10) - parseInt(chunkB, 10);
              if (diff !== 0) return diff;
            } else {
              const comp = chunkA.localeCompare(chunkB);
              if (comp !== 0) return comp;
            }
          }
          return 0;
        });

        if (files.length === 0) {
          gallery.innerHTML = '<p style="padding:40px; text-align:center; color:#888;">该目录下没有找到任何图片文件，请确认路径是否正确。</p>';
          return;
        }

        const currentMode = document.getElementById('btnWt').classList.contains('active') ? 'webtoon' : 'waterfall';
        const sizeClass = isFitWidth ? 'fit-width' : 'orig-size';
        gallery.className = 'gallery ' + currentMode + ' ' + sizeClass;
        gallery.innerHTML = '';

        // 3. 渲染页面 DOM（自动剥离图床生成的时间戳前缀，展示干净文件名）
        files.forEach((item, idx) => {
          const rawName = typeof item === 'string' ? item : (item.name || item.src);
          const imgUrl = rawName.startsWith('http') ? rawName : `${domain}/file/${rawName.replace(/^\/?file\//, '')}`;
          
          const cleanName = rawName.split('/').pop().replace(/^\d{10,}_/, '');

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <a href="${imgUrl}" data-fancybox="manga-browser" data-caption="第 ${idx + 1} 页 - ${cleanName}">
              <img data-src="${imgUrl}" alt="Page ${idx + 1}" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 400'%3E%3C/svg%3E">
            </a>
            <span class="page-badge">${idx + 1} / ${files.length}</span>
          `;
          gallery.appendChild(card);
        });

        // 4. 懒加载观察器
        const observer = new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const img = entry.target;
              img.src = img.dataset.src;
              obs.unobserve(img);
            }
          });
        }, { rootMargin: '1200px 0px' });

        document.querySelectorAll('img[data-src]').forEach(img => observer.observe(img));

      } catch (e) {
        gallery.innerHTML = `<p style="padding:40px; text-align:center; color:#f87171;">加载失败：${e.message}。请确保已在同域登录过 /dashboard 或正确输入了密码。</p>`;
      }
    }

    function enterDir(targetPath) {
      document.getElementById('dir').value = targetPath;
      loadManga();
    }
  </script>
</body>
</html>
