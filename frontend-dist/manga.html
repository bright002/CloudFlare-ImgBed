<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫画无缝阅读器</title>
    <style>
        /* 全局重置与沉浸式背景 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        /* 顶部菜单栏：支持滚动平滑隐藏 */
        #menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
            transition: transform 0.3s ease-in-out; /* 平滑过渡动画 */
        }
        #menu.hidden {
            transform: translateY(-100%); /* 向上滚动时隐藏 */
        }

        .menu-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select, button {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        select option {
            background: #222;
            color: #fff;
        }
        button:hover, select:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 漫画无缝条漫容器 */
        #reader-container {
            max-width: 900px;
            margin: 70px auto 0 auto; /* 预留顶部菜单高度 */
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #000;
            min-height: 100vh;
        }

        /* 漫画图片基础样式 */
        .manga-page {
            width: 100%;
            display: block;
            height: auto;
            margin: 0;
            padding: 0;
            border: none;
            outline: none;
            background-color: #1a1a1a; 
        }

        /* 适配模式样式 */
        #reader-container.fit-width .manga-page {
            width: 100% !important;
            max-width: 100%;
        }
        #reader-container.fit-original .manga-page {
            width: auto !important;
            max-width: none;
        }

        /* 加载提示文字 */
        #loading-tip {
            padding: 40px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 顶部控制菜单栏 -->
    <div id="menu">
        <div class="menu-group">
            <select id="folder-select" onchange="changeFolder()">
                <option value="">请选择卷册 / 目录</option>
            </select>
        </div>
        <div class="menu-group">
            <button id="mode-btn" onclick="toggleMode()">切换：满宽</button>
        </div>
    </div>

    <!-- 无缝条漫图片展示区 -->
    <div id="reader-container" class="fit-width">
        <div id="loading-tip">正在加载目录与图片...</div>
    </div>

    <script>
        // ==========================================
        // 配置区域：图床 API 列表接口
        // ==========================================
        const API_LIST_URL = '/api/manage/list'; 

        let currentMode = 'fit-width'; // 默认模式：fit-width (满宽) 或 fit-original (原始尺寸)

        // 页面初始化
        window.addEventListener('DOMContentLoaded', () => {
            fetchFolderList();
            initScrollHideMenu();
        });

        // 1. 手机端滚动自动隐藏/显示 Menu 栏逻辑
        function initScrollHideMenu() {
            let lastScrollTop = 0;
            const menu = document.getElementById('menu');

            window.addEventListener('scroll', function() {
                let currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                
                if (currentScroll > 50) {
                    if (currentScroll > lastScrollTop) {
                        // 向下滚动：隐藏 Menu
                        menu.classList.add('hidden');
                    } else {
                        // 向上滚动：显示 Menu
                        menu.classList.remove('hidden');
                    }
                } else {
                    menu.classList.remove('hidden');
                }
                lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
            }, false);
        }

        // 2. 获取图床目录列表
        async function fetchFolderList() {
            try {
                // 如果图床单页限制了15个，可尝试带上 limit 参数拉取更多，如 /api/manage/list?limit=1000
                const response = await fetch(API_LIST_URL);
                const data = await response.json();
                
                const files = Array.isArray(data) ? data : (data.data || data.files || []);
                processFolders(files);
            } catch (error) {
                console.error('获取目录失败:', error);
                document.getElementById('loading-tip').innerText = '加载目录失败，请检查 API 接口。';
            }
        }

        // 3. 提取文件夹并按高精度自然升序排序填充下拉菜单
        function processFolders(files) {
            const folderSet = new Set();

            files.forEach(file => {
                const filePath = file.name || file.filename || file.path || '';
                const lastSlashIndex = filePath.lastIndexOf('/');
                
                if (lastSlashIndex !== -1) {
                    const folderPath = filePath.substring(0, lastSlashIndex);
                    folderSet.add(folderPath);
                }
            });

            const folders = Array.from(folderSet);
            
            // 💡 强制按自然升序排列（卷01、卷02、卷03...）
            folders.sort((a, b) => compareNatural(a, b));

            const select = document.getElementById('folder-select');
            folders.forEach(folder => {
                const option = document.createElement('option');
                option.value = folder;
                option.textContent = folder;
                select.appendChild(option);
            });

            if (folders.length > 0) {
                select.value = folders[0];
                changeFolder();
            } else {
                document.getElementById('loading-tip').innerText = '未检测到任何云端虚拟文件夹，请先上传漫画。';
            }
        }

        // 4. 切换卷册时加载对应目录下的所有图片
        async function changeFolder() {
            const selectedFolder = document.getElementById('folder-select').value;
            if (!selectedFolder) return;

            const container = document.getElementById('reader-container');
            container.innerHTML = '<div id="loading-tip">正在加载漫画图片...</div>';

            try {
                const response = await fetch(API_LIST_URL);
                const data = await response.json();
                const files = Array.isArray(data) ? data : (data.data || data.files || []);

                // 筛选出当前选中文件夹下的图片文件
                const folderImages = files.filter(file => {
                    const filePath = file.name || file.filename || file.path || '';
                    return filePath.startsWith(selectedFolder + '/') && isImageFile(filePath);
                });

                // 💡 确保图片按自然升序排列 (000.jpg, 001.jpg, 002.jpg...)
                folderImages.sort((a, b) => {
                    const nameA = (a.name || a.filename || a.path || '').split('/').pop();
                    const nameB = (b.name || b.filename || b.path || '').split('/').pop();
                    return compareNatural(nameA, nameB);
                });

                renderImages(folderImages);

            } catch (error) {
                console.error('加载图片出错:', error);
                container.innerHTML = '<div id="loading-tip">加载图片列表失败。</div>';
            }
        }

        // 5. 渲染无缝条漫图片列表
        function renderImages(images) {
            const container = document.getElementById('reader-container');
            container.innerHTML = '';

            if (images.length === 0) {
                container.innerHTML = '<div id="loading-tip">此目录下没有找到图片。</div>';
                return;
            }

            images.forEach(img => {
                const imgElement = document.createElement('img');
                imgElement.src = img.url || img.src || img.link || ('/' + (img.name || img.filename || img.path));
                imgElement.className = 'manga-page';
                imgElement.loading = 'lazy'; // 浏览器原生懒加载
                
                imgElement.onerror = function() {
                    this.alt = '图片加载失败: ' + imgElement.src;
                };

                container.appendChild(imgElement);
            });
        }

        // 6. 切换阅读模式（自适应满宽 / 原始尺寸）
        function toggleMode() {
            const container = document.getElementById('reader-container');
            const btn = document.getElementById('mode-btn');

            if (currentMode === 'fit-width') {
                currentMode = 'fit-original';
                container.classList.remove('fit-width');
                container.classList.add('fit-original');
                btn.textContent = '切换：原图';
            } else {
                currentMode = 'fit-width';
                container.classList.remove('fit-original');
                container.classList.add('fit-width');
                btn.textContent = '切换：满宽';
            }
        }

        // 7. 高精度自然升序排序算法
        function compareNatural(a, b) {
            const ax = [], bx = [];
            a.replace(/(\d+)|(\D+)/g, (_, $1, $2) => { ax.push([$1 || Infinity, $2 || '']); });
            b.replace(/(\d+)|(\D+)/g, (_, $1, $2) => { bx.push([$1 || Infinity, $2 || '']); });
            
            while (ax.length && bx.length) {
                const an = ax.shift();
                const bn = bx.shift();
                const nn = (an[0] - bn[0]) || an[1].localeCompare(bn[1]);
                if (nn) return nn;
            }
            return ax.length - bx.length;
        }

        // 8. 判断是否为图片后缀
        function isImageFile(filename) {
            return /\.(jpg|jpeg|png|webp|avif|gif)$/i.test(filename);
        }
    </script>
</body>
</html>
